; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_c3_mlx90640

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/patch_alpaca_devices.py
build_flags =
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-I src
	-I include
lib_deps = 
	https://github.com/npeter/ESP32AlpacaDevices2
	adafruit/Adafruit MLX90640@^1.1.2
	adafruit/Adafruit MLX90614 Library@^2.1.5
	adafruit/Adafruit TSL2591 Library@^1.4.5
	adafruit/Adafruit HTU21DF Library@^1.1.2
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit HMC5883 Unified@^1.2.4
    knolleary/PubSubClient@^2.8

[env:esp32_c3_mlx90640]
board = esp32-c3-devkitm-1
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions/esp32_4mb_littlefs_ota.csv
build_flags =
	${env.build_flags}
	-D ESP32_C3_MLX90640
build_src_filter =
	+<*>
	-<Dome.cpp>
	-<CoverCalibrator.cpp>
	-<Focuser.cpp>
	-<ObservingConditions.cpp>
	-<Switch.cpp>

[env:wemos_d1_mini32]
board = wemos_d1_mini32
monitor_port = COM10
upload_speed = 921600
board_build.partitions = partitions/esp32_4mb_littlefs_ota.csv
build_flags = 
	${env.build_flags}
	-D WEMOS_D1_MINI32

[env:esp32_switch]
board = wemos_d1_mini32
upload_speed = 921600
board_build.partitions = partitions/esp32_4mb_littlefs_ota.csv
build_flags =
	${env.build_flags}
	-D ESP32_SWITCH
	-D WEMOS_D1_MINI32
build_src_filter =
	+<*>
	-<AuxSensorSwitch.cpp>
	-<CoverCalibrator.cpp>
	-<Dome.cpp>
	-<Focuser.cpp>
	-<ObservingConditions.cpp>
	-<ThermalCamera.cpp>

[env:esp32_observing_conditions]
board = wemos_d1_mini32
upload_speed = 921600
board_build.partitions = partitions/esp32_4mb_littlefs_ota.csv
build_flags =
	${env.build_flags}
	-D ESP32_OBSERVING_CONDITIONS
	-D WEMOS_D1_MINI32
build_src_filter =
	+<*>
	-<AuxSensorSwitch.cpp>
	-<CoverCalibrator.cpp>
	-<Dome.cpp>
	-<Focuser.cpp>
	-<Switch.cpp>
	-<ThermalCamera.cpp>

[env:esp32_dome]
board = wemos_d1_mini32
upload_speed = 921600
board_build.partitions = partitions/esp32_4mb_littlefs_ota.csv
build_flags =
	${env.build_flags}
	-D ESP32_DOME
	-D WEMOS_D1_MINI32
build_src_filter =
	+<*>
	-<AuxSensorSwitch.cpp>
	-<CoverCalibrator.cpp>
	-<Focuser.cpp>
	-<ObservingConditions.cpp>
	-<Switch.cpp>
	-<ThermalCamera.cpp>
